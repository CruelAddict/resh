# Optional Ctrl preset. Copy to ~/.config/resh/config.toml, or merge [keymap] into it.
# Bindings extend the defaults; the Cmd shortcuts remain unless removed with "none".
# These settings apply inside the picker, not to the Cmd+S launcher.
# Modifiers: cmd, ctrl, alt/option, shift. Keys use US physical positions on any layout.
# Modifiers match exactly; write shifted symbols as "shift+5", not "%".

[keymap]
# source:ID opens a tab. Built-in IDs differ from some displayed names:
# configs = Projects; directories = Recent. Custom source IDs also work here.
"ctrl+t" = "source:sessions"
"ctrl+a" = "source:all"
"ctrl+g" = "source:configs"
"ctrl+x" = "source:directories"
"ctrl+f" = "source:find"
"ctrl+n" = "next"
"ctrl+p" = "previous"
"ctrl+j" = "next"
"ctrl+k" = "previous"
"ctrl+o" = "open"
"ctrl+q" = "dismiss"
"ctrl+shift+d" = "delete" # closes immediately, without confirmation
# Uses the search text as the name; empty text gets a generated name.
"ctrl+shift+n" = "create"
"ctrl+tab" = "next_source"
"ctrl+shift+tab" = "previous_source"
"ctrl+shift+p" = "pin"
# open:1 through open:9 open the numbered items, excluding the current session.
"ctrl+1" = "open:1"
"ctrl+2" = "open:2"
"ctrl+3" = "open:3"
"ctrl+4" = "open:4"
"ctrl+5" = "open:5"
"ctrl+6" = "open:6"
"ctrl+7" = "open:7"
"ctrl+8" = "open:8"
"ctrl+9" = "open:9"

# Remove the All shortcut so Cmd+A selects search text instead. Ctrl+A above still opens All.
"cmd+a" = "none"
