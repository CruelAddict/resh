# Copy to ~/.config/resh/config.toml, or merge the sections you want into it.

# Replace the local home directory with ~ in displayed paths; defaults to false.
shorten_home_path = false

# Float unread sessions and agents above other results; both default to true.
# Pinned sessions and the current session stay above unread results.
float_unread_sessions = true
float_unread_agents = true

# Search using all enabled macOS keyboard layouts; defaults to true.
# For example, typing куыр on a Russian layout also finds resh.
keyboard_layout_search = true

# Controls both view order and visibility: unlisted sources are hidden.
# Omit to keep the default views and append custom sources automatically.
source_order = ["Sessions", "Agents", "All", "Projects", "Work", "Repositories", "Recent", "Find"]
# Must be one of the names in source_order; defaults to "Sessions".
# The initial view stays visible even when empty or its provider is unavailable.
initial_source = "All"

[[sources]]
# The name is both the view label and the key used by source_order, unions and resh_source.
# Names must be nonempty and unique; spaces and Unicode are allowed.
# References are case-sensitive. Update them when renaming a source.
name = "Work"
# A fixed list of directories. Other examples below use command and union.
type = "paths"
# ~ expands; relative paths start beside this config file. Missing folders are skipped.
paths = ["~/work/backend", "~/work/frontend"]

[[sources]]
name = "Repositories"
type = "command"
# Working directory; defaults to the directory containing this config file.
# Relative output paths and relative executable paths resolve against cwd.
cwd = "~/work"
# Print UTF-8 directory paths, one per line. The list refreshes when you open its view.
# Use an explicit shell/script for pipes, redirects and ~ in arguments.
command = ["fd", "-t", "d", "-d", "2", ".", "."]
# Optional; "paths" is the only supported output format.
format = "paths"
# Seconds, greater than 0 and at most 60; defaults to 5.
timeout = 5

[[sources]]
# Reusing a built-in name replaces that source. Here All also includes our own lists.
name = "All"
type = "union"
# Members are combined in this order; duplicate paths appear only once.
# Unions can include other unions, but cannot refer back to themselves.
sources = ["Sessions", "Projects", "Work", "Repositories", "Recent"]

# Other source types reuse built-in providers:
#   sessions — open Rex sessions
#   agents   — panes reporting program statuses; hidden when empty unless initial
#   projects — [[session]] entries
#   zoxide   — directories in zoxide's order
#   find     — fd search under ~, two levels deep, including hidden folders except .Trash
# command/cwd/format apply only to command; paths only to paths; sources only to union.
# All includes sessions, projects and zoxide, and is hidden by default.

