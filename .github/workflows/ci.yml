name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RESH_VERSION: 0.0.0
      RESH_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - name: Check toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run tests
        run: swift test
      - name: Build native helper
        run: bash scripts/build.sh
      - name: Check distribution
        run: |
          dist/resh/resh --help
          dist/resh/resh setup --help
          test "$(dist/resh/resh --name /tmp/resh-release-check)" = resh-release-check
          codesign --verify --strict dist/resh/resh
      - name: Package
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'pull_request'
        with:
          name: macos-${{ matrix.arch }}
          path: dist/releases/resh-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  scripts:
    name: Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes shellcheck lua5.1
      - name: Check shell scripts
        run: |
          bash -n install.sh
          bash -n scripts/build.sh
          bash -n Sources/Resh/Resources/setup.sh
          sh -n scripts/package.sh
          shellcheck install.sh scripts/build.sh scripts/package.sh Sources/Resh/Resources/setup.sh
      - name: Check Lua syntax
        run: luac5.1 -p Sources/Resh/Resources/*.lua integration/*.lua examples/config/*.lua
      - name: Package remote adapter
        run: |
          bash scripts/package.sh
          cp install.sh dist/releases/install.sh
