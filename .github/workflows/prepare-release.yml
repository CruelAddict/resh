name: Prepare release
run-name: Prepare release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v (e.g. 0.2.0 or 0.2.0-rc.1)"
        required: true
        type: string

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ $GITHUB_REF == refs/heads/main ]] || {
            echo 'Run this workflow on main.' >&2
            exit 1
          }
          [[ $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
            echo 'Expected MAJOR.MINOR.PATCH without v, optionally followed by a prerelease suffix.' >&2
            exit 1
          }
      - name: Create release tag token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Create release tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA"
