# Copy to ~/.config/resh/config.toml. Changes apply the next time resh opens.
source_order = ["sessions", "all", "configs", "directories", "find"]

[keymap]
"ctrl+t" = "source:sessions"
"ctrl+a" = "source:all"
"ctrl+g" = "source:configs"
"ctrl+x" = "source:directories"
"ctrl+f" = "source:find"
"ctrl+n" = "next"
"ctrl+p" = "previous"
"ctrl+j" = "next"
"ctrl+k" = "previous"
"ctrl+d" = "delete" # asks for confirmation
"ctrl+r" = "reload"
"ctrl+tab" = "next_source"
"ctrl+shift+tab" = "previous_source"

