# Optional Ctrl preset. Copy to ~/.config/resh/config.toml; changes reload live.
# Optional: override source visibility and order. Otherwise use the app defaults.
# source_order = ["sessions", "all", "configs", "directories", "find"]

[keymap]
"ctrl+t" = "source:sessions"
"ctrl+a" = "source:all"
"ctrl+g" = "source:configs"
"ctrl+x" = "source:directories"
"ctrl+f" = "source:find"
"ctrl+n" = "next"
"ctrl+p" = "previous"
"ctrl+j" = "next"
"ctrl+k" = "previous"
"ctrl+d" = "delete" # asks for confirmation
"ctrl+r" = "reload"
"ctrl+tab" = "next_source"
"ctrl+shift+tab" = "previous_source"
"ctrl+shift+p" = "pin"
"ctrl+1" = "open:1"
"ctrl+2" = "open:2"
"ctrl+3" = "open:3"
"ctrl+4" = "open:4"
"ctrl+5" = "open:5"
"ctrl+6" = "open:6"
"ctrl+7" = "open:7"
"ctrl+8" = "open:8"
"ctrl+9" = "open:9"

